# Static landing page, served behind the existing Traefik (netbird-traefik).
# No host port is published: Traefik reaches the container on its Docker network.
services:
  anki-site:
    image: nginxinc/nginx-unprivileged:1.27-alpine   # official nginx image, runs as non-root (uid 101)
    container_name: anki-site
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [traefik]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-netbird_netbird}   # = --providers.docker.network of netbird-traefik
